[project]
name = "brain-inventory-mcp"
version = "0.1.0"
description = "An MCP server that turns an Obsidian vault's inventory notes into tools Claude can read and edit, with self-hosted OAuth for remote/phone use."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "obsidian", "inventory", "claude", "oauth"]
dependencies = [
    "mcp[cli]>=1.27.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
brain-inventory-mcp = "brain_inventory_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_inventory_mcp"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
